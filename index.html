<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Hack: System Override</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --term-bg: #050505;
            --term-green: #00ff41;
            --term-cyan: #00ffff;
            --term-red: #ff003c;
            --term-dim: #008f11;
            --scanline-color: rgba(0, 255, 65, 0.03);
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--term-bg);
            color: var(--term-green);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .terminal-container {
            position: relative;
            z-index: 10;
            border: 1px solid var(--term-dim);
            box-shadow: 0 0 10px var(--term-dim), inset 0 0 20px rgba(0, 143, 17, 0.2);
            background: rgba(5, 5, 5, 0.9);
        }

        .terminal-header {
            background: var(--term-dim);
            color: var(--term-bg);
            padding: 4px 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .cyber-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--term-dim);
            color: var(--term-green);
            font-family: 'Share Tech Mono', monospace;
            outline: none;
            text-shadow: 0 0 5px var(--term-green);
        }
        
        .cyber-input:focus {
            border-bottom-color: var(--term-cyan);
            box-shadow: 0 5px 5px -5px var(--term-cyan);
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid var(--term-green);
            color: var(--term-green);
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            text-shadow: 0 0 5px var(--term-green);
            box-shadow: 0 0 5px rgba(0, 255, 65, 0.2);
        }

        .cyber-btn:hover:not(:disabled) {
            background: var(--term-green);
            color: var(--term-bg);
            box-shadow: 0 0 15px var(--term-green);
        }

        .cyber-btn:disabled {
            border-color: var(--term-dim);
            color: var(--term-dim);
            cursor: not-allowed;
            text-shadow: none;
            box-shadow: none;
        }

        .option-node {
            border: 1px solid var(--term-dim);
            background: rgba(0, 143, 17, 0.05);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .option-node:hover:not(.locked) {
            border-color: var(--term-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            color: var(--term-cyan);
        }

        .option-node.locked {
            cursor: default;
        }

        .status-granted {
            border-color: var(--term-cyan) !important;
            background: rgba(0, 255, 255, 0.1) !important;
            box-shadow: 0 0 20px var(--term-cyan) !important;
            color: var(--term-cyan) !important;
        }

        .status-denied {
            border-color: var(--term-red) !important;
            background: rgba(255, 0, 60, 0.1) !important;
            box-shadow: 0 0 20px var(--term-red) !important;
            color: var(--term-red) !important;
            text-decoration: line-through;
        }

        .feedback-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            font-weight: bold;
            padding: 5px 15px;
            background: var(--term-bg);
            border: 2px solid;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 20;
        }

        .feedback-overlay.show {
            opacity: 1;
            animation: pulse 1s infinite alternate;
        }

        .granted-text { color: var(--term-cyan); border-color: var(--term-cyan); text-shadow: 0 0 10px var(--term-cyan); }
        .denied-text { color: var(--term-red); border-color: var(--term-red); text-shadow: 0 0 10px var(--term-red); }

        @keyframes pulse {
            from { box-shadow: 0 0 10px currentColor; }
            to { box-shadow: 0 0 20px currentColor, inset 0 0 10px currentColor; }
        }

        .hide { display: none !important; }
        
        .blink { animation: blink-animation 1s steps(2, start) infinite; }
        @keyframes blink-animation { to { visibility: hidden; } }

    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="terminal-container w-full max-w-6xl flex flex-col min-h-[80vh]">
        <div class="terminal-header">
            <span>root@sys_override:~#</span>
            <span>v2.0.4 [SECURE]</span>
        </div>

        <div class="flex-grow flex flex-col p-6 sm:p-10 relative">

            <!-- SCREEN 1: SETUP -->
            <div id="screen-setup" class="w-full h-full flex flex-col items-center justify-center space-y-8 my-auto">
                <div class="text-center mb-8">
                    <h1 class="text-4xl sm:text-6xl font-bold mb-2 text-shadow" style="text-shadow: 0 0 15px var(--term-green);">CYBER-HACK</h1>
                    <h2 class="text-2xl sm:text-3xl text-[var(--term-cyan)]" style="text-shadow: 0 0 10px var(--term-cyan);">SYSTEM OVERRIDE</h2>
                </div>
                
                <div class="w-full max-w-md border border-[var(--term-dim)] p-6 bg-black/50">
                    <p class="mb-4">> INITIALISE HACK SQUADRONS...</p>
                    <div class="flex flex-col space-y-4">
                        <label class="text-lg">SELECT NUMBER OF TEAMS (2-10):</label>
                        <select id="num-teams" class="cyber-input text-2xl py-2 bg-black">
                            <option value="2">2 TEAMS</option>
                            <option value="3">3 TEAMS</option>
                            <option value="4">4 TEAMS</option>
                            <option value="5">5 TEAMS</option>
                            <option value="6">6 TEAMS</option>
                            <option value="7">7 TEAMS</option>
                            <option value="8">8 TEAMS</option>
                            <option value="9">9 TEAMS</option>
                            <option value="10">10 TEAMS</option>
                        </select>
                    </div>
                    
                    <div id="team-names-container" class="mt-6 flex flex-col space-y-3 max-h-[30vh] overflow-y-auto pr-2">
                        <!-- Populated by JS based on select -->
                    </div>

                    <button id="btn-start" class="cyber-btn w-full py-4 mt-8 text-xl font-bold">BREACH SYSTEM (Start)</button>
                </div>
            </div>

            <!-- SCREEN 2: MAIN GAME -->
            <div id="screen-game" class="w-full h-full flex flex-col lg:flex-row gap-8 hide">
                
                <!-- Sidebar: Scoreboard -->
                <div class="w-full lg:w-1/4 border border-[var(--term-dim)] p-4 flex flex-col">
                    <h3 class="text-xl border-b border-[var(--term-dim)] pb-2 mb-4">> NETWORK STATUS</h3>
                    <div class="mb-4 text-[var(--term-cyan)]">
                        > ROUND: <span id="ui-round">1</span> / <span id="ui-max-round">X</span>
                    </div>
                    <div id="scoreboard" class="flex flex-col space-y-2 overflow-y-auto">
                        <!-- Scores populated dynamically -->
                    </div>
                </div>

                <!-- Main Play Area -->
                <div class="w-full lg:w-3/4 flex flex-col relative">
                    
                    <div class="mb-6 border-b border-[var(--term-dim)] pb-4">
                        <div class="text-sm text-[var(--term-dim)]">> ACTIVE UPLINK ESTABLISHED</div>
                        <h2 class="text-2xl mt-2">> WAITING ON: <span id="ui-current-team" class="text-[var(--term-cyan)] animate-pulse">Team Name</span><span class="blink">_</span></h2>
                        <div class="text-sm mt-1 text-[var(--term-dim)]">> DECRYPTION PROTOCOL: <span id="ui-category" class="text-white">Category</span></div>
                    </div>

                    <div class="border border-[var(--term-dim)] p-6 mb-8 bg-black/60 min-h-[140px] flex items-center justify-center text-center">
                        <p id="ui-clue" class="text-xl sm:text-2xl leading-relaxed"></p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 relative" id="options-container">
                        <!-- Options populated dynamically -->
                    </div>

                    <div id="turn-controls" class="mt-8 flex justify-end hide">
                        <button id="btn-next-turn" class="cyber-btn px-8 py-3 text-lg font-bold">> EXECUTE NEXT TURN</button>
                    </div>

                </div>
            </div>

            <!-- SCREEN 3: END GAME -->
            <div id="screen-end" class="w-full h-full flex flex-col items-center justify-center space-y-8 my-auto hide">
                <div class="text-center mb-4">
                    <h1 class="text-5xl font-bold mb-2 text-[var(--term-cyan)]" style="text-shadow: 0 0 15px var(--term-cyan);">SYSTEM OVERRIDDEN</h1>
                    <p class="text-xl">> MAINFRAME ACCESS SECURED.</p>
                </div>
                
                <div class="w-full max-w-2xl border border-[var(--term-cyan)] p-8 bg-black/80 shadow-[0_0_20px_rgba(0,255,255,0.2)]">
                    <h2 class="text-2xl border-b border-[var(--term-cyan)] pb-2 mb-6">> FINAL HACKER RANKINGS:</h2>
                    <div id="final-standings" class="flex flex-col space-y-3 text-lg">
                        <!-- Standings populated dynamically -->
                    </div>
                </div>

                <button id="btn-reboot" class="cyber-btn px-10 py-4 mt-8 text-xl font-bold">> REBOOT TERMINAL</button>
            </div>

        </div>
    </div>

    <script>
        // --- 56 HARDCODED QUESTIONS ---
        const db = [
            // SYNONYMY
            { category: "Synonymy", question: "Your team needs a 'secret' door. Which word means the same as 'secret'?", options: ["Open", "Hidden", "Noisy", "Usual"], answerIndex: 1 },
            { category: "Synonymy", question: "Your job is to 'remove' the bad program. Which word means the same as 'remove'?", options: ["Take away", "Copy", "Check", "Add"], answerIndex: 0 },
            { category: "Synonymy", question: "You make a 'fake' ID card to get in. Which word means the same as 'fake'?", options: ["Real", "False", "Large", "Lost"], answerIndex: 1 },
            { category: "Synonymy", question: "The computer needs a 'real' password. Which word means the same as 'real'?", options: ["Long", "True", "Short", "Secret"], answerIndex: 1 },
            { category: "Synonymy", question: "The security rules are very 'old'. Which word is closest in meaning?", options: ["Modern", "Outdated", "Strong", "Fast"], answerIndex: 1 },
            { category: "Synonymy", question: "It is 'important' to stay online. Which word means the same as 'important'?", options: ["Useless", "Necessary", "Dangerous", "Slow"], answerIndex: 1 },
            { category: "Synonymy", question: "Your team must 'enter' the computer without being seen. Which word means the same as 'enter'?", options: ["Leave", "Go into", "Fix", "Watch"], answerIndex: 1 },

            // ANTONYMY
            { category: "Antonymy", question: "The file is 'locked'. Pick the opposite word.", options: ["Unlocked", "Heavy", "Small", "Hidden"], answerIndex: 0 },
            { category: "Antonymy", question: "The robot wants to 'connect' to the network. You must stop it. Pick the opposite of 'connect'.", options: ["Disconnect", "Help", "Watch", "Join"], answerIndex: 0 },
            { category: "Antonymy", question: "The password is 'weak'. Make it the opposite: ______.", options: ["Strong", "Short", "Quiet", "Small"], answerIndex: 0 },
            { category: "Antonymy", question: "We leave the 'virtual' world and go to the ______ world.", options: ["Digital", "Real", "Online", "Game"], answerIndex: 1 },
            { category: "Antonymy", question: "Do not make the picture 'bigger'. Make it ______ to save space.", options: ["Smaller", "Taller", "Brighter", "Wider"], answerIndex: 0 },
            { category: "Antonymy", question: "The guard says 'allow'. Pick the opposite word.", options: ["Permit", "Refuse", "Accept", "Agree"], answerIndex: 1 },
            { category: "Antonymy", question: "The company uses 'artificial' intelligence. We use ______ thinking.", options: ["Natural", "Fake", "Machine", "Computer"], answerIndex: 0 },

            // HYPONYMY
            { category: "Hyponymy", question: "Which one is a kind of animal?", options: ["A dog", "A table", "A car", "A phone"], answerIndex: 0 },
            { category: "Hyponymy", question: "Which one is a part of a computer?", options: ["A screen", "A song", "An email", "A password"], answerIndex: 0 },
            { category: "Hyponymy", question: "Which one is a kind of device?", options: ["A phone", "A river", "A tree", "A chair"], answerIndex: 0 },
            { category: "Hyponymy", question: "Which one uses your body to open a door?", options: ["The eye scan", "The password", "The number code", "The key card"], answerIndex: 0 },
            { category: "Hyponymy", question: "Which one is a kind of message?", options: ["An email", "A cable", "A chair", "A battery"], answerIndex: 0 },
            { category: "Hyponymy", question: "Which one is a kind of program?", options: ["A game", "A cable", "A battery", "A screen"], answerIndex: 0 },
            { category: "Hyponymy", question: "Which one is a place to save files?", options: ["A hard drive", "A battery", "A screen", "A fan"], answerIndex: 0 },

            // HOMONYMY
            { category: "Homonymy", question: "The report says there is a 'bug' in the game. What does 'bug' mean here?", options: ["An insect in the room", "A mistake in the program", "A hidden microphone", "A cold or flu"], answerIndex: 1 },
            { category: "Homonymy", question: "You sit at the 'terminal'. What does it mean here?", options: ["The end of a train line", "A computer where you type commands", "A place at an airport", "A very serious illness"], answerIndex: 1 },
            { category: "Homonymy", question: "The 'mouse' is broken. Which meaning fits?", options: ["A small animal", "A tool you click with", "To move quietly", "A shy person"], answerIndex: 1 },
            { category: "Homonymy", question: "You need the right 'key' to open the file.", options: ["A tool that opens a door", "A secret code for a file", "A button on a piano", "A small island"], answerIndex: 1 },
            { category: "Homonymy", question: "Send the message through the 'port'.", options: ["A town by the sea for ships", "A kind of wine", "A computer connection point", "The left side of a ship"], answerIndex: 2 },
            { category: "Homonymy", question: "The 'server' is too busy.", options: ["A person who brings food", "A tennis player who hits first", "A computer that gives information to others", "A tray for drinks"], answerIndex: 2 },
            { category: "Homonymy", question: "The robot goes online and searches the 'web'. Which meaning fits?", options: ["A net made by a spider", "The internet", "A mix of lies", "Skin between a duck's toes"], answerIndex: 1 },

            // HOMOPHONY
            { category: "Homophony", question: "The virus will eat every ______ of data on the computer.", options: ["Bite", "Byte", "Bat", "Boat"], answerIndex: 1 },
            { category: "Homophony", question: "Clear the ______ to remove our tracks.", options: ["Cash", "Cache", "Catch", "Cart"], answerIndex: 1 },
            { category: "Homophony", question: "To control the drone, match its ______ number.", options: ["Cereal", "Serial", "Real", "Seal"], answerIndex: 1 },
            { category: "Homophony", question: "We must ______ the two computers, or the plan will fail.", options: ["Sink", "Sync", "Sing", "Sign"], answerIndex: 1 },
            { category: "Homophony", question: "The hacker was ______ from the game forever.", options: ["Band", "Banned", "Bend", "Bond"], answerIndex: 1 },
            { category: "Homophony", question: "Unplug the broken circuit ______.", options: ["Bored", "Board", "Bird", "Broad"], answerIndex: 1 },
            { category: "Homophony", question: "The thief will ______ your information to a bad man.", options: ["Cell", "Sell", "Sale", "Shell"], answerIndex: 1 },

            // POLYSEMY
            { category: "Polysemy", question: "The robot lost its 'charge'. What is missing?", options: ["Electric power", "A rush forward to attack", "A price to pay", "Saying someone did a crime"], answerIndex: 0 },
            { category: "Polysemy", question: "Click to 'execute' the program. What does 'execute' mean here?", options: ["To kill a person", "To start and run it", "To sign a paper", "To paint a picture"], answerIndex: 1 },
            { category: "Polysemy", question: "The robot's 'program' is very long. What is a program here?", options: ["A TV show", "A paper list for a play", "A set of computer instructions", "A plan for the day"], answerIndex: 2 },
            { category: "Polysemy", question: "Let the test 'run' all night. What does 'run' mean here?", options: ["To move fast on foot", "To keep working", "A hole in a sock", "A point in cricket"], answerIndex: 1 },
            { category: "Polysemy", question: "The computer is out of 'memory'. What is memory here?", options: ["Remembering the past", "A gift to remember someone", "Space to store data", "A happy feeling about the past"], answerIndex: 2 },
            { category: "Polysemy", question: "The boss will 'monitor' the computers.", options: ["A computer screen", "To watch and check", "A big lizard", "A student helper"], answerIndex: 1 },
            { category: "Polysemy", question: "Delete the 'record' from the list.", options: ["A music disc", "The best score ever", "One line of saved data", "To film a video"], answerIndex: 2 },

            // METONYMY
            { category: "Metonymy", question: "Overheard message: 'The Suits want to delete everything.' Who wants this?", options: ["The company bosses", "The tailors", "The guards in uniform", "The robots"], answerIndex: 0 },
            { category: "Metonymy", question: "Overheard message: 'Silicon Valley just fixed the problem.' What does this mean?", options: ["A valley full of sand", "The tech companies", "A sand company", "A computer chip brand"], answerIndex: 1 },
            { category: "Metonymy", question: "Overheard message: 'We need an OK from The Board.' Who is The Board?", options: ["A piece of wood", "A computer part", "The group of company bosses", "A blackboard"], answerIndex: 2 },
            { category: "Metonymy", question: "Overheard message: 'Wall Street is helping the new startup.' Who is Wall Street?", options: ["A real street made of bricks", "The money and banking world", "A gang of hackers", "A building company"], answerIndex: 1 },
            { category: "Metonymy", question: "Overheard message: 'The Brass wants the doors to be safer.' Who is The Brass?", options: ["The top bosses", "A kind of metal", "A group of musicians", "Used bullet cases"], answerIndex: 0 },
            { category: "Metonymy", question: "Overheard message: 'Tell Headquarters about the problem.' What does Headquarters mean?", options: ["Just a building", "The main office and its leaders", "A hat shop", "The front of a line"], answerIndex: 1 },
            { category: "Metonymy", question: "Overheard message: 'The Crown has banned this secret code.' Who is The Crown?", options: ["A golden hat", "A cover for a tooth", "The government", "The top of a tree"], answerIndex: 2 },

            // COLLOCATION
            { category: "Collocation", question: "Pick the word that goes with it: 'Artificial' ______.", options: ["Brain", "Intelligence", "Thoughts", "Mind"], answerIndex: 1 },
            { category: "Collocation", question: "Pick the word that goes with it: 'Virtual' ______.", options: ["Truth", "Reality", "Dream", "Story"], answerIndex: 1 },
            { category: "Collocation", question: "Pick the word that goes with it: 'Cyber' ______.", options: ["Safety", "Protection", "Security", "Guards"], answerIndex: 2 },
            { category: "Collocation", question: "Pick the word that goes with it: 'Machine' ______.", options: ["Learning", "Studying", "Reading", "Educating"], answerIndex: 0 },
            { category: "Collocation", question: "Pick the word that goes with it: 'Social' ______.", options: ["Media", "Paper", "Press", "Tool"], answerIndex: 0 },
            { category: "Collocation", question: "Pick the word that goes with it: 'Computer' ______.", options: ["Virus", "Disease", "Illness", "Cold"], answerIndex: 0 },
            { category: "Collocation", question: "Pick the word that goes with it: 'Search' ______.", options: ["Motor", "Machine", "Engine", "Tool"], answerIndex: 2 }
        ];

        // --- GAME STATE ---
        let teams = [];
        let currentTeamIndex = 0;
        let currentRound = 1;
        let maxRounds = 5;
        let questionPool = [];

        // --- DOM ELEMENTS ---
        const screens = {
            setup: document.getElementById('screen-setup'),
            game: document.getElementById('screen-game'),
            end: document.getElementById('screen-end')
        };

        const inputs = {
            numTeams: document.getElementById('num-teams'),
            teamNamesContainer: document.getElementById('team-names-container')
        };

        const buttons = {
            start: document.getElementById('btn-start'),
            nextTurn: document.getElementById('btn-next-turn'),
            reboot: document.getElementById('btn-reboot')
        };

        const ui = {
            round: document.getElementById('ui-round'),
            maxRound: document.getElementById('ui-max-round'),
            scoreboard: document.getElementById('scoreboard'),
            currentTeam: document.getElementById('ui-current-team'),
            category: document.getElementById('ui-category'),
            clue: document.getElementById('ui-clue'),
            optionsContainer: document.getElementById('options-container'),
            turnControls: document.getElementById('turn-controls')
        };

        // --- UTILITIES ---
        function switchScreen(screenKey) {
            Object.values(screens).forEach(s => s.classList.add('hide'));
            screens[screenKey].classList.remove('hide');
        }

        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        // --- SETUP PHASE ---
        function renderTeamInputs() {
            const num = parseInt(inputs.numTeams.value);
            inputs.teamNamesContainer.innerHTML = '';
            for (let i = 1; i <= num; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex items-center space-x-2';
                wrapper.innerHTML = `
                    <span class="text-[var(--term-dim)]">> ID_${i}:</span>
                    <input type="text" class="team-name-input cyber-input w-full p-1" placeholder="SQUAD_${i}" value="SQUAD_${i}">
                `;
                inputs.teamNamesContainer.appendChild(wrapper);
            }
        }

        inputs.numTeams.addEventListener('change', renderTeamInputs);
        renderTeamInputs(); // Initial render

        buttons.start.addEventListener('click', () => {
            const nameInputs = document.querySelectorAll('.team-name-input');
            teams = [];
            nameInputs.forEach((input, index) => {
                let name = input.value.trim().toUpperCase();
                if (!name) name = `SQUAD_${index + 1}`;
                teams.push({ name: name, score: 0 });
            });

            // Dynamic Rounds Logic
            const teamCount = teams.length;
            if (teamCount <= 3) maxRounds = 10;
            else if (teamCount <= 5) maxRounds = 7;
            else maxRounds = 5;

            questionPool = shuffleArray([...db]);
            currentTeamIndex = 0;
            currentRound = 1;
            ui.maxRound.textContent = maxRounds;
            
            updateScoreboard();
            switchScreen('game');
            startTurn();
        });

        // --- PLAY PHASE ---
        function updateScoreboard() {
            ui.scoreboard.innerHTML = '';
            teams.forEach((t, i) => {
                const isActive = i === currentTeamIndex;
                const div = document.createElement('div');
                div.className = `flex justify-between items-center p-2 border-l-4 transition-colors ${isActive ? 'border-[var(--term-cyan)] bg-[var(--term-cyan)]/10 text-[var(--term-cyan)]' : 'border-[var(--term-dim)] text-[var(--term-dim)]'}`;
                
                div.innerHTML = `
                    <span class="truncate pr-2 ${isActive ? 'font-bold' : ''}">${t.name}</span>
                    <span class="font-bold tracking-widest">${t.score.toString().padStart(4, '0')}</span>
                `;
                ui.scoreboard.appendChild(div);
            });
            ui.round.textContent = currentRound;
        }

        function startTurn() {
            updateScoreboard();
            const team = teams[currentTeamIndex];
            ui.currentTeam.textContent = team.name;
            ui.turnControls.classList.add('hide');
            ui.optionsContainer.innerHTML = '';

            if (questionPool.length === 0) {
                questionPool = shuffleArray([...db]); // Refill if exhausted
            }
            const qData = questionPool.pop();

            ui.category.textContent = `[${qData.category.toUpperCase()}]`;
            ui.clue.innerHTML = `> ${qData.question}`;

            // Create options array that retains original index to check answer
            let optionsWithIndex = qData.options.map((text, idx) => ({ text, isCorrect: idx === qData.answerIndex }));
            optionsWithIndex = shuffleArray(optionsWithIndex);

            optionsWithIndex.forEach((opt) => {
                const btn = document.createElement('div');
                btn.className = 'option-node p-4 flex flex-col justify-center items-center text-center min-h-[100px]';
                
                const text = document.createElement('span');
                text.className = 'font-bold text-lg';
                text.textContent = opt.text;

                const feedback = document.createElement('div');
                feedback.className = `feedback-overlay ${opt.isCorrect ? 'granted-text' : 'denied-text'}`;
                feedback.textContent = opt.isCorrect ? 'ACCESS GRANTED' : 'ACCESS DENIED';

                btn.appendChild(text);
                btn.appendChild(feedback);

                btn.addEventListener('click', () => handleAnswer(btn, opt.isCorrect, optionsWithIndex, feedback));
                ui.optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(clickedBtn, isCorrect, optionsData, feedbackEl) {
            const allNodes = ui.optionsContainer.querySelectorAll('.option-node');
            if (allNodes[0].classList.contains('locked')) return;

            allNodes.forEach(node => node.classList.add('locked'));
            feedbackEl.classList.add('show');

            if (isCorrect) {
                clickedBtn.classList.add('status-granted');
                teams[currentTeamIndex].score += 100; // Cyberpunk points scale
            } else {
                clickedBtn.classList.add('status-denied');
                // Highlight correct answer
                const nodesArray = Array.from(allNodes);
                const correctIndex = optionsData.findIndex(o => o.isCorrect);
                if(correctIndex !== -1 && nodesArray[correctIndex] !== clickedBtn) {
                    nodesArray[correctIndex].classList.add('status-granted');
                    nodesArray[correctIndex].style.opacity = '0.7';
                }
            }

            updateScoreboard();
            ui.turnControls.classList.remove('hide');
        }

        buttons.nextTurn.addEventListener('click', () => {
            currentTeamIndex++;
            if (currentTeamIndex >= teams.length) {
                currentTeamIndex = 0;
                currentRound++;
            }

            if (currentRound > maxRounds) {
                endGame();
            } else {
                startTurn();
            }
        });

        // --- END PHASE ---
        function endGame() {
            switchScreen('end');
            const standings = document.getElementById('final-standings');
            standings.innerHTML = '';

            const sortedTeams = [...teams].sort((a, b) => b.score - a.score);
            const highestScore = sortedTeams[0].score;

            sortedTeams.forEach((t, i) => {
                const isWinner = t.score === highestScore;
                const row = document.createElement('div');
                row.className = `flex justify-between items-center p-3 border-b border-[var(--term-dim)] ${isWinner ? 'text-[var(--term-cyan)] font-bold bg-[var(--term-cyan)]/10' : 'text-gray-400'}`;
                
                let rankStr = isWinner ? "[SYS_ADMIN]" : `[RANK_0${i+1}]`;

                row.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <span class="w-28 text-sm">${rankStr}</span>
                        <span>${t.name}</span>
                    </div>
                    <span class="tracking-widest">${t.score.toString().padStart(4, '0')} PTS</span>
                `;
                standings.appendChild(row);
            });
        }

        buttons.reboot.addEventListener('click', () => {
            switchScreen('setup');
        });

    </script>
</body>
</html>
